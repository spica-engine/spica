name: Spica Master Deployment

env:
  NX_NO_CLOUD: true
  VERSION: master
  BASE_URL: /
  VITE_BASE_URL: /api

on:
  push:
    branches: ["master"]

jobs:
  build_and_push:
    name: Build and Push (${{ matrix.project }})
    runs-on: ubuntu-latest
    outputs:
      panel: ${{ steps.digest.outputs.panel }}
      api: ${{ steps.digest.outputs.api }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: api
            dir: apps/api
          - project: panel
            dir: apps/panel
          - project: migrate
            dir: apps/migrate
          - project: mongoreplicationcontroller
            dir: apps/mongoreplicationcontroller
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Restore Node Modules Cache
        uses: actions/cache@v4
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-${{ hashFiles('**/yarn.lock') }}
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: yarn install --frozen-lockfile --network-timeout 600000

      - name: Prune project
        run: yarn nx prune ${{ matrix.project }}

      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Restore Docker Cache
        uses: actions/cache@v4
        id: cache
        with:
          path: docker-cache-mounts
          key: ${{ runner.os }}-docker-cache-${{ matrix.project }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-docker-cache-${{ matrix.project }}-

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.dir }}
          file: ${{ matrix.dir }}/Dockerfile
          push: true
          tags: |
            spicaengine/${{ matrix.project }}:${{ env.VERSION }}
            spicaengine/${{ matrix.project }}:latest
          target: runner
          platforms: linux/amd64, linux/arm64
          cache-from: type=gha,scope=${{ matrix.project }}
          cache-to: type=gha,scope=${{ matrix.project }},mode=max

      - name: Export image digest
        run: echo "${{ matrix.project }}=${{ steps.build.outputs.digest }}" >> $GITHUB_OUTPUT
        id: digest

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build_and_push
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::979211735897:role/spica-master-deployer
          aws-region: eu-central-1

      - name: Get EKS Credentials
        run: aws eks update-kubeconfig --name startups --region eu-central-1

      - name: Kubectl tool installer
        uses: Azure/setup-kubectl@v4.0.0

      - name: Deploy to EKS
        env:
          PANEL_DIGEST: ${{ needs.build_and_push.outputs.panel }}
          API_DIGEST: ${{ needs.build_and_push.outputs.api }}
          MASTER_KEY: ${{ secrets.SPICA_MASTER_KEY }}
        run: |
          NS=infrastructure-master-spicaengine-com
          if [ -z "$MASTER_KEY" ]; then
            echo "::error::SPICA_MASTER_KEY secret is not set"
            exit 1
          fi
          kubectl create secret generic spica-master-key -n $NS \
            --from-literal=master-key="$MASTER_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f ./deployment.yaml
          if [ -n "$PANEL_DIGEST" ]; then
            kubectl set image statefulset/spica spica=spicaengine/panel@$PANEL_DIGEST -n $NS
          fi
          if [ -n "$API_DIGEST" ]; then
            kubectl set image statefulset/spica api=spicaengine/api@$API_DIGEST -n $NS
          fi
          kubectl rollout restart statefulset/spica -n $NS
          kubectl rollout status statefulset/spica -n $NS --timeout=120s
