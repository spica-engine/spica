name: Spica Continuous Integration

env:
  origin_branch: master
  VERSION: ${{ github.sha }}
  MONGODB_URL: "mongodb://172.17.0.1:27017"
  # Phase 7: the second test leg. Because a ready server is supplied, the tests start no container and
  # the `initdb` readiness race (the problem waitForPostgres solves) never arises in CI.
  POSTGRES_URL: "postgres://postgres:spica-test@172.17.0.1:5432/postgres"
  MAILER_URL: "smtp://172.17.0.1:1025,api://172.17.0.1:8025"
  RABBITMQ_URL: "amqp://172.17.0.1:5672"
  NX_FORCE_NO_DAEMON: true

on:
  pull_request:
    branches: ["master"]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  helm_lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install Helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0

      - name: Lint Helm Charts
        run: |
          helm lint charts/spica \
            --set application.secret=lint-secret \
            --set application.bucketDataHashSecret=lint-hash-secret \
            --set application.publicHost=lint.example.com

  helm_unittest:
    name: Helm Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install Helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --verify=false
      - name: Run Helm unit tests
        run: |
          helm unittest charts/spica \
            --output-type junit \
            --output-file helm-unittest-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helm-unittest-results
          path: helm-unittest-results.xml

  build_affected:
    name: Build Affected
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Restore Node Modules Cache
        uses: actions/cache@v4
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-${{ hashFiles('**/yarn.lock') }}
            ${{ runner.os }}-node-modules-
      - name: Install dependencies
        run: yarn install --frozen-lockfile --network-timeout 600000
      - name: Fetch base branch
        run: git fetch origin ${{ env.origin_branch }}:${{ env.origin_branch }}
      - name: Disable Nx Cloud
        run: echo "NX_NO_CLOUD=true" >> $GITHUB_ENV
      - name: Verify TypeScript project references in sync
        run: yarn nx sync:check
      # The hand-written system table definitions against the interfaces they are derived from (D14). The same
      # class of defect appeared five times (R17, R58, R69, R71, R106) and the fifth survived an audit done by
      # eye — so it is a check now, not a habit.
      - name: Audit system table definitions
        run: node scripts/audit-system-tables.mjs
      - name: Build Affected
        run: yarn nx affected -t build

  prepare_tests:
    name: Prepare Affected Test Matrix
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.affected.outputs.projects }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Restore Node Modules Cache
        uses: actions/cache@v4
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-${{ hashFiles('**/yarn.lock') }}
            ${{ runner.os }}-node-modules-
      - name: Install dependencies
        run: yarn install --frozen-lockfile --network-timeout 600000
      - name: Fetch base branch
        run: git fetch origin ${{ env.origin_branch }}:${{ env.origin_branch }}
      - name: Disable Nx Cloud
        run: echo "NX_NO_CLOUD=true" >> $GITHUB_ENV
      - name: Calculate affected test projects
        id: affected
        run: |
          projects=$(yarn nx show projects --affected -t test --json || echo "[]")
          echo "projects=${projects:-[]}" >> "$GITHUB_OUTPUT"

  test_affected:
    name: Test Affected
    runs-on: ubuntu-latest
    needs:
      - prepare_tests
    if: ${{ needs.prepare_tests.outputs.projects != '[]' && needs.prepare_tests.outputs.projects != '' }}
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.prepare_tests.outputs.projects) }}
        # K-5: both backends side by side, permanently. This matrix stays after the project is done
        # and is not taken down — parity is only kept when it is measured continuously.
        backend: [mongodb, postgres]
      exclude:
        # `migrate` is MongoDB-specific **by construction**: `apps/migrate/src/migrate.ts` constructs
        # a `new mongodb.MongoClient(...)` directly and every script transforms the MongoDB documents
        # of a past Spica version. On a PostgreSQL installation there is no old data to transform —
        # the first schema is created with the current version.
        #
        # The specs are **removed** from the matrix rather than `skip`ped: `skip` means "it may pass
        # one day", and here there is nothing to pass. More importantly, without removing them the leg
        # **would look green** — because `start()` starts MongoDB without looking at
        # `SPICA_TEST_BACKEND`, so the "postgres" leg was actually testing MongoDB. A false green is
        # worse than a red one (K-4).
        - project: migrate
          backend: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Restore Node Modules Cache
        uses: actions/cache@v4
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-${{ hashFiles('**/yarn.lock') }}
            ${{ runner.os }}-node-modules-
      - name: Start MongoDB
        run: |
          docker run -d --rm --name mongodb \
            -p 27017:27017 \
            mongo:8.0.4 \
            --replSet testset --bind_ip_all

          echo "Waiting for MongoDB to start..."
          for i in {1..10}; do
            if docker exec mongodb mongosh --eval "db.adminCommand('ping')" &> /dev/null; then
              echo "MongoDB is ready. Initializing replica set..."
              docker exec mongodb mongosh --eval "rs.initiate({_id: 'testset', members: [{_id: 0, host: 'localhost:27017'}]})"
              sleep 5
              echo "Verifying replica set status..."
              docker exec mongodb mongosh --eval "rs.status()"
              echo "MongoDB replica set is ready."
              break
            fi
            echo "Attempt $i: MongoDB not ready yet, waiting..."
            sleep 2
          done

      - name: Start PostgreSQL
        if: matrix.backend == 'postgres'
        run: |
          docker run -d --rm --name postgres \
            -p 5432:5432 \
            -e POSTGRES_PASSWORD=spica-test \
            postgres:16

          echo "Waiting for PostgreSQL..."
          for i in {1..30}; do
            if docker exec postgres pg_isready -q; then
              echo "PostgreSQL is ready."
              break
            fi
            echo "Attempt $i: PostgreSQL not ready yet, waiting..."
            sleep 2
          done

      - name: Start RabbitMQ
        run: |
          docker run -d --rm --name rabbitmq \
            -p 5672:5672 \
            rabbitmq:4.1

          echo "Waiting for RabbitMQ..."
          for i in {1..10}; do
            if nc -z localhost 5672; then
              echo "RabbitMQ is ready."
              break
            fi
            sleep 2
          done
      - name: Start Mailer
        run: |
          docker run -d --rm --name mailer \
            -p 1025:1025 \
            -p 8025:8025 \
            mailhog/mailhog

          echo "Waiting for Mailer..."
          for i in {1..10}; do
            if nc -z localhost 1025 && nc -z localhost 8025; then
              echo "Mailer is ready."
              break
            fi
            sleep 2
          done
      - name: Install dependencies
        run: yarn install --frozen-lockfile --network-timeout 600000
      - name: Fetch base branch
        run: git fetch origin ${{ env.origin_branch }}:${{ env.origin_branch }}
      - name: Disable Nx Cloud
        run: echo "NX_NO_CLOUD=true" >> $GITHUB_ENV

      # The PostgreSQL leg **blocks** as of Phase 7's completion (29 September 2026). It carried
      # `continue-on-error` while the known failures in `docs/pg-known-failures.md` were driven to zero;
      # both legs now run the same 78 projects and report the same 3068 tests. K-5 says the two backends
      # live side by side permanently, and parity is only kept when a break stops the build.
      - name: Run Tests
        run: |
          MONGODB_URL=$MONGODB_URL \
          MAILER_URL=$MAILER_URL \
          RABBITMQ_URL=$RABBITMQ_URL \
          POSTGRES_URL=$POSTGRES_URL \
          SPICA_TEST_BACKEND=${{ matrix.backend }} \
          yarn nx test ${{ matrix.project }}

      - name: Stop RabbitMQ
        run: docker stop rabbitmq || true

      - name: Stop Mailer
        run: docker stop mailer || true

      - name: Stop MongoDB
        run: docker stop mongodb || true

      - name: Stop PostgreSQL
        if: matrix.backend == 'postgres'
        run: docker stop postgres || true

  ci_success:
    name: CI Success
    runs-on: ubuntu-latest
    needs:
      - helm_lint
      - helm_unittest
      - build_affected
      - test_affected
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [ "${{ needs.helm_lint.result }}" != "success" ] || \
             [ "${{ needs.helm_unittest.result }}" != "success" ] || \
             [ "${{ needs.build_affected.result }}" != "success" ] || \
             ([ "${{ needs.test_affected.result }}" != "success" ] && [ "${{ needs.test_affected.result }}" != "skipped" ]); then
            echo "One or more jobs failed or were cancelled"
            exit 1
          fi
          echo "All jobs completed successfully!"
