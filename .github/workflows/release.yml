name: Spica Release

env:
  NX_NO_CLOUD: true
  BASE_URL: /
  VITE_BASE_URL: /api

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  docker-images:
    name: Release Docker image (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - project: api
            dir: apps/api
          - project: panel
            dir: apps/panel
          - project: migrate
            dir: apps/migrate
          - project: mongoreplicationcontroller
            dir: apps/mongoreplicationcontroller

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Restore Node Modules Cache
        uses: actions/cache@v4
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-${{ hashFiles('**/yarn.lock') }}
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: yarn install --frozen-lockfile --network-timeout 600000

      - name: Prune project
        run: yarn nx prune ${{ matrix.project }}

      - name: Set the VERSION
        run: |
          VERSION=$(git describe --tags --abbrev=0)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Cache Docker cache mounts
        uses: actions/cache@v4
        id: cache
        with:
          path: docker-cache-mounts
          key: ${{ runner.os }}-docker-cache-${{ matrix.project }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-docker-cache-${{ matrix.project }}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.dir }}
          file: ${{ matrix.dir }}/Dockerfile
          push: true
          tags: spicaengine/${{ matrix.project }}:${{ env.VERSION }}
          target: runner
          platforms: linux/amd64, linux/arm64
          cache-from: type=gha,scope=${{ matrix.project }}
          cache-to: type=gha,scope=${{ matrix.project }},mode=max

  npm-packages:
    name: Release npm package (${{ matrix.target }})
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        target:
          - devkit:auth
          - devkit:bucket
          - devkit:database
          - devkit:identity
          - devkit:storage
          - devkit:testing
          - devkit:sync
          - cli

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install npm with trusted publishing support
        run: npm install -g npm@^11.5.1

      - name: Restore Node Modules Cache
        uses: actions/cache@v4
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-${{ hashFiles('**/yarn.lock') }}
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: yarn install --frozen-lockfile --network-timeout 600000

      - name: Disable Nx Cloud
        run: echo "NX_NO_CLOUD=true" >> $GITHUB_ENV

      - name: Set the VERSION
        run: |
          VERSION=$(git describe --tags --abbrev=0)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Set Yarn registry explicitly
        run: yarn config set npmRegistryServer https://registry.npmjs.org

      - name: Release npm packages
        run: yarn run publish:${{ matrix.target }}

  helm-charts:
    name: Release Helm charts
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set the VERSION
        run: |
          VERSION=$(git describe --tags --abbrev=0)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Install Helm
        uses: azure/setup-helm@v4.2.0

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Release Helm charts
        run: ./scripts/sync_charts.sh
