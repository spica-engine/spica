# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: postgresql pg_cron setup job
templates:
  - templates/postgrescron.yaml
release:
  name: release-name
  namespace: default
set:
  application.secret: test-secret
  application.masterKey: test-master-key
  application.publicHost: https://test.example.com
  database.type: postgresql

tests:
  - it: should render nothing on a fresh install, where the init script creates the extension
    asserts:
      - hasDocuments:
          count: 0

  - it: should render nothing for the mongodb engine
    release:
      upgrade: true
    set:
      database.type: mongodb
    asserts:
      - hasDocuments:
          count: 0

  - it: should run as a post-upgrade hook on upgrade
    release:
      upgrade: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Job
      - equal:
          path: metadata.name
          value: release-name-database-cron
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-upgrade

  - it: should use the pg_cron image and the root credentials
    release:
      upgrade: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: spicaengine/postgres:18
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGUSER
            valueFrom:
              secretKeyRef:
                name: release-name-database-root-credentials
                key: rootUsername
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGPASSWORD
            valueFrom:
              secretKeyRef:
                name: release-name-database-root-credentials
                key: rootPassword

  - it: should create the extension idempotently and let the spica role schedule jobs
    release:
      upgrade: true
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: CREATE EXTENSION IF NOT EXISTS pg_cron;
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: GRANT USAGE ON SCHEMA cron TO :"app_user";
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: GRANT EXECUTE ON FUNCTION cron.schedule_in_database
