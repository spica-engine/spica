# Default values for spica.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
database:
  replicas: 1
  replicaSetName: 'rs0'
  name: spica
  version: '8.0.4'
  storageSize: 2Gi
  storageClass:
  resources: {}
  replicationControllerImage:
  spicaUsername:
  spicaPassword:
  rootUsername:
  rootPassword:
  replicaAuthKey:
  logLevel: 0
  profilingLevel: 1
  profilingSlowms: 100
  terminationGracePeriodSeconds: 60
  # probes
  # startup
  startupProbeInitialDelaySeconds: 15
  startupProbePeriodSeconds: 5
  startupProbeTimeoutSeconds: 15
  startupProbeFailureThreshold: 30
  # liveness
  livenessProbePeriodSeconds: 30
  livenessProbeTimeoutSeconds: 15
  livenessProbeFailureThreshold: 3
  # readiness
  readinessProbePeriodSeconds: 10
  readinessProbeTimeoutSeconds: 15
  readinessProbeFailureThreshold: 3

images:
  api: spicaengine/api
  web: spicaengine/panel
  replicationcontroller: spicaengine/mongoreplicationcontroller
  migrate: spicaengine/migrate

application:
  replicas: 1
  # Master key used to derive all module-specific secrets (hash, encryption, etc) except secrets specifically provided
  masterKey:
  # each secret will override the masterKey derived secret
  # optional if masterKey is provided, all required if not
  # passport secret for signing JWT tokens
  secret:
  # bucket data encryption/hash secret for encrypting/hashing data stored in buckets
  bucketDataHashSecret:
  bucketDataEncryptionSecret:
  # secret to encrypt secrets stored in secret module(especially function secrets)
  secretModuleEncryptionSecret:
  # user verification hash secret for hashing user verification tokens
  userVerificationHashSecret:
  # user provider encryption/hash secret for encrypting/hashing user email/phone number etc.
  userProviderEncryptionSecret:
  userProviderHashSecret:
  refreshTokenHashSecret:
  # sms provider configuration
  twilioAccountSid:
  twilioAuthToken:
  twilioFromNumber:
  defaultPassword: spica
  webBaseUrl: /
  apiBaseUrl: /api/
  publicHost:
  storageSize: 2Gi
  storageClass:
  apiResources: {}
  webResources: {}
  args: []
  # extra headers attached to every api response, eg:
  # responseHeaders:
  #   Cache-Control: "no-store"
  #   X-Frame-Options: "DENY"
  responseHeaders: {}
  # How the API keeps /data (cached function code; storage objects with --storage-strategy default).
  #   empty (default): diskless. A Deployment with an emptyDir; functions are restored from prebuilt
  #     archives in the function asset bucket. Requires functionAssets (awss3 or gcs) and a
  #     non-default --storage-strategy in args.
  #   ReadWriteOnce: a StatefulSet with a volume per pod.
  #   ReadWriteMany: a Deployment with one shared volume.
  # Releases created when ReadWriteOnce was the default keep it when this is empty, detected through
  # their existing StatefulSet. `helm template` (e.g. ArgoCD) cannot detect it, so set ReadWriteOnce
  # explicitly before upgrading such installations. To move an existing release to diskless, upgrade
  # once with its current mode and functionAssets set, so functions created before asset storage are
  # uploaded to the bucket, then clear this value.
  diskAccessMode:
  # size limit of the /data emptyDir in diskless mode
  emptyDirSizeLimit: 10Gi
  # bucket that holds function sources and prebuilt archives (required in diskless mode).
  # Rendered as --function-asset-* flags; do not pass those flags in args as well.
  functionAssets:
    strategy: # default | awss3 | gcs
    awss3:
      bucketName:
      # optional, the AWS SDK default credential chain (e.g. IRSA) is used when empty
      credentialsPath:
    gcs:
      bucketName:
      serviceAccountPath:
      # name of a Secret holding the service account key, mounted at /etc/spica/function-assets-gcs
      serviceAccountSecret:
      serviceAccountSecretKey: key.json
  serviceAccountName: default
  podAnnotations: {}
  # probes
  # startup
  apiStartupProbeInitialDelaySeconds: 10
  apiStartupProbePeriodSeconds: 5
  apiStartupProbeTimeoutSeconds: 3
  apiStartupProbeFailureThreshold: 24
  # diskless pods download every function on start, which takes longer on large projects
  apiStartupProbeFailureThresholdDiskless: 120
  # liveness
  apiLivenessProbePeriodSeconds: 30
  apiLivenessProbeTimeoutSeconds: 10
  apiLivenessProbeFailureThreshold: 6
  # readiness
  apiReadinessProbePeriodSeconds: 10
  apiReadinessProbeTimeoutSeconds: 10
  apiReadinessProbeFailureThreshold: 6
ingress:
  hosts: []
  tls: []
  ingressClassName: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 15M
    nginx.ingress.kubernetes.io/client-body-buffer-size: 15Mb
    nginx.ingress.kubernetes.io/rewrite-target: /$1
