# Default values for spica.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
database:
  # Which backend: mongodb | postgres (the two stay side by side permanently).
  # The default is mongodb, so existing installations do not change at all with this value.
  backend: mongodb
  # A managed database. When it is given the chart creates no database StatefulSet.
  #
  # **This is also the PostgreSQL HA path**: run an operator-managed cluster — CloudNativePG —
  # and point this at its `-rw` service, which always resolves to the current primary. The chart names
  # no operator resource and depends on no CRD; see docs/postgresql-ha.md for why failover is delegated
  # and why a read replica cannot be used.
  #
  # Credentials: put them in the URI, or set `spicaUsername`/`spicaPassword` to keep them in a secret.
  # The API rewrites the URI's user and password from `DATABASE_USERNAME`/`DATABASE_PASSWORD`, and the
  # chart only wires those env vars when it owns the credentials — for an external URI that means when
  # `spicaPassword` is supplied. It used to wire them unconditionally, which replaced the operator's own
  # credentials with a generated password and broke every external database.
  external:
    uri:
  # The instance guard: an instance record is written to the database, which prevents silently connecting
  # to the wrong database or to a different backend. Left empty, the Helm release name is used;
  # setting it explicitly to "" switches the guard off.
  instanceId:
  # Allows an **empty** database on the first startup. Setting it to `false` after the initial
  # installation also catches connecting to the wrong URI (a populated database is accepted without
  # this flag anyway).
  initialize: true
  # `true` for GitOps (ArgoCD) installations. ArgoCD renders the chart with `helm template`, so
  # `lookup` returns empty and the generated password **would change on every sync**. With `true`,
  # password generation is switched off and, when none is supplied, the render stops with a clear
  # error — rather than rotating the password silently.
  managedSecrets: false
  # Bundled PostgreSQL (created only when backend=postgres and external.uri is empty).
  postgres:
    version: '16'
    port: 5432
  # Raw SQL access for functions (`@spica-devkit/postgres`). Meaningful on PostgreSQL only.
  #
  # While it is closed the devkit **refuses explicitly**: handing the API's fully privileged connection
  # to a function would mean bucket tables could be dropped with raw SQL.
  #
  # On a bundled installation the role is created by the chart; on a managed database a ready role is
  # supplied with `externalUri`. Its privileges (DML on bucket, read-only on spica, full on app) are
  # applied by the API at startup — it does not create the role, it only grants.
  functions:
    enabled: false
    username: spica_functions
    password:
    # A managed database: the full connection URI of a ready role. When it is given, username/password
    # are not used.
    externalUri:
  # The bundled **MongoDB** replica set size. It does not apply to PostgreSQL: bundled PostgreSQL is
  # single-pod by design and the render fails if this is raised there, rather than quietly giving one pod.
  # PostgreSQL HA goes through `external.uri` above.
  replicas: 1
  replicaSetName: 'rs0'
  name: spica
  version: '8.0.4'
  storageSize: 2Gi
  storageClass:
  resources: {}
  replicationControllerImage:
  spicaUsername:
  spicaPassword:
  rootUsername:
  rootPassword:
  replicaAuthKey:
  logLevel: 0
  profilingLevel: 1
  profilingSlowms: 100
  terminationGracePeriodSeconds: 60
  # probes
  # startup
  startupProbeInitialDelaySeconds: 15
  startupProbePeriodSeconds: 5
  startupProbeTimeoutSeconds: 15
  startupProbeFailureThreshold: 30
  # liveness
  livenessProbePeriodSeconds: 30
  livenessProbeTimeoutSeconds: 15
  livenessProbeFailureThreshold: 3
  # readiness
  readinessProbePeriodSeconds: 10
  readinessProbeTimeoutSeconds: 15
  readinessProbeFailureThreshold: 3

images:
  api: spicaengine/api
  web: spicaengine/panel
  replicationcontroller: spicaengine/mongoreplicationcontroller
  migrate: spicaengine/migrate

application:
  replicas: 1
  # Master key used to derive all module-specific secrets (hash, encryption, etc) except secrets specifically provided
  masterKey:
  # each secret will override the masterKey derived secret
  # optional if masterKey is provided, all required if not
  # passport secret for signing JWT tokens
  secret:
  # bucket data encryption/hash secret for encrypting/hashing data stored in buckets
  bucketDataHashSecret:
  bucketDataEncryptionSecret:
  # secret to encrypt secrets stored in secret module(especially function secrets)
  secretModuleEncryptionSecret:
  # user verification hash secret for hashing user verification tokens
  userVerificationHashSecret:
  # user provider encryption/hash secret for encrypting/hashing user email/phone number etc.
  userProviderEncryptionSecret:
  userProviderHashSecret:
  refreshTokenHashSecret:
  # sms provider configuration
  twilioAccountSid:
  twilioAuthToken:
  twilioFromNumber:
  defaultPassword: spica
  webBaseUrl: /
  apiBaseUrl: /api/
  publicHost:
  storageSize: 2Gi
  storageClass:
  apiResources: {}
  webResources: {}
  args: []
  # extra headers attached to every api response, eg:
  # responseHeaders:
  #   Cache-Control: "no-store"
  #   X-Frame-Options: "DENY"
  responseHeaders: {}
  diskAccessMode: ReadWriteOnce
  serviceAccountName: default
  podAnnotations: {}
  # probes
  # startup
  apiStartupProbeInitialDelaySeconds: 10
  apiStartupProbePeriodSeconds: 5
  apiStartupProbeTimeoutSeconds: 3
  apiStartupProbeFailureThreshold: 24
  # liveness
  apiLivenessProbePeriodSeconds: 30
  apiLivenessProbeTimeoutSeconds: 10
  apiLivenessProbeFailureThreshold: 6
  # readiness
  apiReadinessProbePeriodSeconds: 10
  apiReadinessProbeTimeoutSeconds: 10
  apiReadinessProbeFailureThreshold: 6
ingress:
  hosts: []
  tls: []
  ingressClassName: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 15M
    nginx.ingress.kubernetes.io/client-body-buffer-size: 15Mb
    nginx.ingress.kubernetes.io/rewrite-target: /$1
