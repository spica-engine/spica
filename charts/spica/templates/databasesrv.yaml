{{- /* The database service — only when the chart creates the database itself. */ -}}
{{- if include "database.bundled" . }}
apiVersion: v1
kind: Service
metadata:
  namespace: {{.Release.Namespace}}
  name: {{ .Release.Name }}-database
  labels:
    app.kubernetes.io/name: database-srv
    app.kubernetes.io/component: service
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
    app.kubernetes.io/part-of: {{ .Chart.Name }}
    app.kubernetes.io/managed-by: helm
spec:
  publishNotReadyAddresses: true
  ports:
{{- if include "database.is-postgres" . }}
    - port: {{ .Values.database.postgres.port }}
      targetPort: {{ .Values.database.postgres.port }}
{{- else }}
    - port: 27017
      targetPort: 27017
{{- end }}
  {{- /*
    A headless service is **mandatory** on MongoDB: the replica set members find each other by pod
    DNS name. On PostgreSQL there is a single pod and headless works correctly there too, so no
    separate service type is needed.
  */}}
  clusterIP: None
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}-database
    app.kubernetes.io/component: database
{{- end }}
