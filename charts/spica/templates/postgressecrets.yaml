{{- if eq .Values.database.type "postgresql" }}
apiVersion: v1
kind: Secret
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ .Release.Name }}-postgres-credentials
  annotations:
    "helm.sh/hook": pre-install, pre-upgrade
    "helm.sh/hook-weight": "-1"
type: Opaque
data:
  username: |
    {{- $value := .Values.postgres.username | default "" }}
    {{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-postgres-credentials" .Release.Name) }}
    {{- if $value }}
      {{ $value | b64enc }}
    {{- else if $existing }}
      {{ $existing.data.username }}
    {{- else }}
      {{ "spica" | b64enc }}
    {{- end }}

  password: |
    {{- $value := .Values.postgres.password | default "" }}
    {{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-postgres-credentials" .Release.Name) }}
    {{- if $value }}
      {{ $value | b64enc }}
    {{- else if $existing }}
      {{ $existing.data.password }}
    {{- else if .Values.postgres.external.enabled }}
      {{ required "postgres.password is required when postgres.external.enabled is true" "" }}
    {{- else }}
      {{ include "generatePassword" . | b64enc }}
    {{- end }}
{{- end }}
