{{- if eq (include "database.engine" .) "postgresql" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: {{.Release.Namespace}}
  name: {{ .Release.Name }}-database
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-database
    app.kubernetes.io/component: database
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
    app.kubernetes.io/part-of: {{ .Chart.Name }}
    app.kubernetes.io/managed-by: helm
spec:
  serviceName: {{ .Release.Name }}-database
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-database
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-database
        app.kubernetes.io/component: database
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: {{ .Chart.Name }}
        app.kubernetes.io/managed-by: helm
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/postgressecrets.yaml") . | sha256sum }}
        checksum/initdb: {{ include (print $.Template.BasePath "/postgresinitdb.yaml") . | sha256sum }}
    spec:
      volumes:
        - name: init-db
          configMap:
            name: {{ .Release.Name }}-database
            defaultMode: 0755
      containers:
        - name: postgres
          image: {{ .Values.database.postgresImage }}:{{ include "database.version" . }}
          ports:
            - containerPort: 5432
          startupProbe:
            exec:
              command:
                - "/bin/sh"
                - "-c"
                - pg_isready -U "$POSTGRES_USER" -d postgres
            initialDelaySeconds: {{ .Values.database.startupProbeInitialDelaySeconds }}
            periodSeconds: {{ .Values.database.startupProbePeriodSeconds }}
            timeoutSeconds: {{ .Values.database.startupProbeTimeoutSeconds }}
            failureThreshold: {{ .Values.database.startupProbeFailureThreshold }}
          livenessProbe:
            tcpSocket:
              port: 5432
            periodSeconds: {{ .Values.database.livenessProbePeriodSeconds }}
            timeoutSeconds: {{ .Values.database.livenessProbeTimeoutSeconds }}
            failureThreshold: {{ .Values.database.livenessProbeFailureThreshold }}
          readinessProbe:
            exec:
              command:
                - "/bin/sh"
                - "-c"
                - pg_isready -U "$POSTGRES_USER" -d postgres
            periodSeconds: {{ .Values.database.readinessProbePeriodSeconds }}
            timeoutSeconds: {{ .Values.database.readinessProbeTimeoutSeconds }}
            failureThreshold: {{ .Values.database.readinessProbeFailureThreshold }}
          resources:
{{ toYaml .Values.database.resources | indent 12 }}
          volumeMounts:
            - name: {{ .Release.Name }}-data
              mountPath: /var/lib/postgresql
            - name: init-db
              mountPath: /docker-entrypoint-initdb.d
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-database-root-credentials
                  key: rootUsername
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-database-root-credentials
                  key: rootPassword
            - name: POSTGRES_DB
              value: postgres
            - name: SPICA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-database-spica-credentials
                  key: spicaUsername
            - name: SPICA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-database-spica-credentials
                  key: spicaPassword
            - name: SPICA_DATABASE
              value: {{ .Values.database.name }}
      terminationGracePeriodSeconds: {{ .Values.database.terminationGracePeriodSeconds }}
      {{- if .Values.database.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.database.nodeSelector | indent 8 }}
      {{- end }}
      {{- if .Values.database.tolerations }}
      tolerations:
{{ toYaml .Values.database.tolerations | indent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: {{ .Release.Name }}-data
      spec:
        storageClassName: {{.Values.database.storageClass}}
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{.Values.database.storageSize}}
{{- end }}
