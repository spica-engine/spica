apiVersion: v1
kind: Secret
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ .Release.Name }}-database-spica-credentials
  annotations:
    "helm.sh/hook": pre-install, pre-upgrade
    "helm.sh/hook-weight": "-1"
type: Opaque
data:
  spicaUsername: |
    {{- $value := .Values.database.spicaUsername | default "" }}
    {{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-database-spica-credentials" .Release.Name) }}
    {{- if $value }}
      {{ $value | b64enc }}
    {{- else if $existing }}
      {{ $existing.data.spicaUsername }}
    {{- else }}
      {{ "spica" | b64enc }}
    {{- end }}

  {{- /*
    Password generation can be switched off with `managedSecrets`.

    **Why it is needed.** ArgoCD renders the chart with `helm template`; there `lookup` returns empty,
    so the "keep the existing password" branch below never runs and the generated password changed
    **on every sync**. The consequence is not silent but is noticed late: the database keeps the old
    password and the API cannot connect with the new one. With `managedSecrets: true` the password has
    to come from values (or from an external secret), and if it is not supplied the render **stops**.
  */}}
  spicaPassword: |
    {{- $value := .Values.database.spicaPassword | default "" }}
    {{- if .Values.database.managedSecrets }}
      {{ required "database.managedSecrets is true, so database.spicaPassword must be provided: generated passwords would rotate on every GitOps sync." $value | b64enc }}
    {{- else }}
    {{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-database-spica-credentials" .Release.Name) }}
    {{- if $value }}
      {{ $value | b64enc }}
    {{- else if $existing }}
      {{ $existing.data.spicaPassword }}
    {{- else }}
      {{ include "generatePassword" . | b64enc }}
    {{- end }}
    {{- end }}

---
{{- /*
  The connection given to functions (K-11), kept **in a secret**: it contains a password, and passing
  it as an argument would write it into the pod definition. The API reads it from the
  `DATABASE_FUNCTIONS_URI` env var.
*/ -}}
{{- $functionsUri := include "database.functions-uri" . }}
{{- if $functionsUri }}

apiVersion: v1
kind: Secret
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ .Release.Name }}-database-functions-credentials
  annotations:
    "helm.sh/hook": pre-install, pre-upgrade
    "helm.sh/hook-weight": "-1"
type: Opaque
data:
  uri: {{ $functionsUri | b64enc | quote }}
{{- end }}

---
{{- /*
  The `root` user and the replica auth key are **Mongo-specific**: the first is `init-users.sh`'s
  administrative user, the second the shared key of the replica set members. Neither has a counterpart
  on PostgreSQL — bundled PostgreSQL is created with a single user (`spicaUsername`) that owns the
  database.
*/ -}}
{{- if not (include "database.is-postgres" .) }}

apiVersion: v1
kind: Secret
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ .Release.Name }}-database-root-credentials
  annotations:
    "helm.sh/hook": pre-install, pre-upgrade
    "helm.sh/hook-weight": "-1"
type: Opaque
data:
  rootUsername: |
    {{- $value := .Values.database.rootUsername | default "" }}
    {{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-database-root-credentials" .Release.Name) }}
    {{- if $value }}
      {{ $value | b64enc }}
    {{- else if $existing }}
      {{ $existing.data.rootUsername }}
    {{- else }}
      {{ "root" | b64enc }}
    {{- end }}

  rootPassword: |
    {{- $value := .Values.database.rootPassword | default "" }}
    {{- if .Values.database.managedSecrets }}
      {{ required "database.managedSecrets is true, so database.rootPassword must be provided: generated values would rotate on every GitOps sync." $value | b64enc }}
    {{- else }}
    {{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-database-root-credentials" .Release.Name) }}
    {{- if $value }}
      {{ $value | b64enc }}
    {{- else if $existing }}
      {{ $existing.data.rootPassword }}
    {{- else }}
      {{ include "generatePassword" . | b64enc }}
    {{- end }}
    {{- end }}

---

apiVersion: v1
kind: Secret
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ .Release.Name }}-database-replica-auth-key
  annotations:
    "helm.sh/hook": pre-install, pre-upgrade
    "helm.sh/hook-weight": "-1"
type: Opaque
data:
  replicaAuthKey: |
    {{- $value := .Values.database.replicaAuthKey | default "" }}
    {{- if .Values.database.managedSecrets }}
      {{ required "database.managedSecrets is true, so database.replicaAuthKey must be provided: generated values would rotate on every GitOps sync." $value | b64enc }}
    {{- else }}
    {{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-database-replica-auth-key" .Release.Name) }}
    {{- if $value }}
      {{ $value | b64enc }}
    {{- else if $existing }}
      {{ $existing.data.replicaAuthKey }}
    {{- else }}
      {{ randAlphaNum 20 | b64enc }}
    {{- end }}
    {{- end }}
{{- end }}
