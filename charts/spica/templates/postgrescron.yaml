{{- if and .Release.IsUpgrade (eq (include "database.engine" .) "postgresql") }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-database-cron
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: database-cron
    app.kubernetes.io/component: migration
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
    app.kubernetes.io/part-of: {{ .Chart.Name }}
    app.kubernetes.io/managed-by: helm
  annotations:
    helm.sh/hook: post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: database-cron
          image: {{ .Values.database.postgresImage }}:{{ include "database.version" . }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              until pg_isready -q; do sleep 2; done
              until psql -tA -c "SHOW shared_preload_libraries" | grep -q pg_cron; do sleep 2; done
              psql -v ON_ERROR_STOP=1 -v app_user="$SPICA_USERNAME" <<'SQL'
              CREATE EXTENSION IF NOT EXISTS pg_cron;
              GRANT USAGE ON SCHEMA cron TO :"app_user";
              GRANT EXECUTE ON FUNCTION cron.schedule_in_database(text, text, text, text, text, boolean) TO :"app_user";
              SQL
          env:
            - name: PGHOST
              value: {{ .Release.Name }}-database.{{ .Release.Namespace }}.svc.cluster.local
            - name: PGDATABASE
              value: postgres
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-database-root-credentials
                  key: rootUsername
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-database-root-credentials
                  key: rootPassword
            - name: SPICA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-database-spica-credentials
                  key: spicaUsername
      {{- if .Values.database.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.database.nodeSelector | indent 8 }}
      {{- end }}
      {{- if .Values.database.tolerations }}
      tolerations:
{{ toYaml .Values.database.tolerations | indent 8 }}
      {{- end }}
{{- end }}
