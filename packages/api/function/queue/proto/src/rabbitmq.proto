syntax = "proto3";

package RabbitMQ;

message Message {
    string id = 1;
    bytes content = 2;
    string fields = 3;
    string properties = 4;
    bytes errorMessage = 5;
    string mode = 6;
    string stream = 7;
    string consumer = 8;

    message Pop {
        string id = 1;
    }

    message Settle {
        string id = 1;
        bool allUpTo = 2;
        bool requeue = 3;
    }

    message Result {}

    message StoreOffset {
        string consumer = 1;
        string offset = 2;
    }

}

service Queue {
    rpc pop(Message.Pop) returns (Message);
    rpc ack(Message.Settle) returns (Message.Result);
    rpc nack(Message.Settle) returns (Message.Result);
    rpc reject(Message.Settle) returns (Message.Result);
    rpc ackAll(Message.Settle) returns (Message.Result);
    rpc nackAll(Message.Settle) returns (Message.Result);
    rpc storeOffset(Message.StoreOffset) returns (Message.Result);
}
